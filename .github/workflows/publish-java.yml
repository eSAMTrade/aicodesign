name: Publish Java to Maven Central

# Publishes java/ to Maven Central (central.sonatype.com).
# Trigger by pushing a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central                       # matches <publishingServerId> in pom.xml
          server-username: CENTRAL_TOKEN_USERNAME   # env var read for the portal token (user)
          server-password: CENTRAL_TOKEN_PASSWORD   # env var read for the portal token (pass)
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE            # env var read for the GPG key passphrase

      - name: Publish to Maven Central
        working-directory: java
        run: mvn -B -ntp deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
